<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flowers</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #ffe6f0 0%, #b96dad 50%, #301a4f 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .scene {
      text-align: center;
      padding: 20px;
      max-width: 700px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 0.3rem;
      letter-spacing: 0.08em;
      text-transform: capitalize;
    }
    p {
      margin: 1rem auto 0;
      max-width: 520px;
      line-height: 1.6;
      color: #f4e7ff;
    }
    .flower {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto;
      animation: float 6s ease-in-out infinite;
    }
    .petal {
      position: absolute;
      width: 120px;
      height: 140px;
      background: radial-gradient(circle at 40% 30%, #ff9ad6, #f3287f 60%);
      border-radius: 70% 70% 50% 50%;
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
      transform-origin: center bottom;
      opacity: 0.95;
    }
    .petal:nth-child(1) { transform: rotate(0deg) translateY(-20px); left: 70px; top: 0; }
    .petal:nth-child(2) { transform: rotate(60deg) translateY(-20px); left: 58px; top: 16px; }
    .petal:nth-child(3) { transform: rotate(120deg) translateY(-20px); left: 44px; top: 66px; }
    .petal:nth-child(4) { transform: rotate(180deg) translateY(-20px); left: 70px; top: 110px; }
    .petal:nth-child(5) { transform: rotate(240deg) translateY(-20px); left: 120px; top: 118px; }
    .petal:nth-child(6) { transform: rotate(300deg) translateY(-20px); left: 144px; top: 70px; }
    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 92px;
      height: 92px;
      margin-left: -46px;
      margin-top: -46px;
      background: radial-gradient(circle, #fff7a1 0%, #ffd22d 65%, #d47b00 100%);
      border-radius: 50%;
      box-shadow: 0 0 0 14px rgba(255, 218, 115, 0.15);
    }
    .stem {
      position: absolute;
      left: 50%;
      top: 220px;
      width: 16px;
      height: 240px;
      margin-left: -8px;
      background: linear-gradient(180deg, #71b56a 0%, #2b6738 100%);
      border-radius: 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.12);
    }
    .leaf {
      position: absolute;
      width: 90px;
      height: 50px;
      background: linear-gradient(135deg, #7aca7e 0%, #2d5d30 100%);
      border-radius: 70% 30% 60% 40%;
      top: 120px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.16);
    }
    .leaf--left { left: -50px; transform: rotate(-35deg); }
    .leaf--right { right: -50px; transform: rotate(35deg); }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <h1>Flower Garden</h1>
    <div class="flower">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center"></div>
      <div class="stem"></div>
      <div class="leaf leaf--left"></div>
      <div class="leaf leaf--right"></div>
    </div>
    <p>This file is now self-contained and opens directly in your browser without external CSS or JavaScript files.</p>
  </div>
</body>
</html>
